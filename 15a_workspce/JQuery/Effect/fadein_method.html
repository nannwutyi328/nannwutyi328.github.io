    <p>The <code>FadeIn()</code>method<b><i>fade in  element</i></b></p>


    <pre>
        Sytax: <code>$(selector).FadeIn();</code>
    </pre>


    <p class="para bg-success text-white" style="display: none; width:fit-content; margin: auto;" >This is a paragraph</p>

    <button id="fadein" class="btn btn-info">Show</button>

</div>


    <script>
        //jquery
        $("#fadein").mouseenter(function(){
            $(".para").fadeIn()
