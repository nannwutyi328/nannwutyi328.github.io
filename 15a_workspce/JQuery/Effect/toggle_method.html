<body >
    <div class="container text-center">
    ့<h2>JQuery Effects:Toggle Method</h2>
    <p>The <code>Toggle()</code>method<b><i>switches a hide and show element</i></b></p>


    <pre>
        Sytax: <code>$(selector).toggle();</code>
    </pre>


    <p class="para" ">This is a paragraph</p>

    <button id="show" class="btn btn-info">Show</button>

</div>


    <script>
        //jquery
        $("#show").dblclick(function(){
            $(".para").toggle()
        });
       


    </script>
