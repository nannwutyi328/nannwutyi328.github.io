<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;


        }


      
        
    </style>

</head>

<body>
    <div class="container mt-3 text-center">

        <h2>JQuery Effects:SlideUp Method</h2>
        <p>The <code>slideUp()</code>method<b><i>slides an element  upward to make it visible.</i></b></p>


        <p>
            Sytax: <code>$(selector).slideUp();</code>
        </p>

<!-- box -->
 <div>
 <img src="../images/image.png" alt="image" >
</div>
      <!-- <div id="box" style=" width: fit-content;" class="bg-dark text-white p-3 m-auto ">Welcome to jQuery Effects</div> -->
        <br>

        
            <button id="up" class="btn btn-info"> Slide UP</button>

      


    </div>


    <!-- jquery -->
    <script>
        $("#up").dblclick(function(){
            $("img").slideUp("slow");
        })

    
    </script>

</body>

</html>
