    ့<h2>JQuery Effects: Show Method</h2>
    <p>The <code>show()</code><b><i>display a hidden element</i></b></p>


    <pre>
        Sytax: <code>$(selector).show();</code>
    </pre>


    <p class="para" style="display: none;">This is a paragraph</p>

    <button id="show" class="btn btn-info">Show</button>

</div>


    <script>
        //jquery
        $("#show").click(function(){
            $(".para").show()
        });


    </script>
