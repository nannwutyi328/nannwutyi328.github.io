<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;


        }


        #box {
            width: 200px;
            height: 200px;
            background-color: aqua;

            margin: 20px;










        }

        
    </style>

</head>

<body>
    <div class="container mt-3 text-center">

        <h2>JQuery Effects:FadeTo Method</h2>
        <p>The <code>FadeTo()</code>method<b><i>changes the opacity of an element to a specified value.</i></b></p>


        <p>
            Sytax: <code>$(selector).FadeTo(speed,opacity,callback);</code>
        </p>

        <p>Speed: "slow","fast" or milliiseconds</p>

        <p>Opacity: 0.0(fully transparent) to 1.0(fully visible)</p>
        <!-- <p class="para bg-success text-white" style="display: none; width:fit-content; margin: auto;" >This is a paragraph</p> -->
        <div id="box" style="margin: auto;"></div>

        <br>
        <div>
            <button id="fadebtn" class="btn btn-info"> Fade to</button>
            <button id="resetbtn" class="btn btn-info ">Reset</button>

        </div>


    </div>


    <!-- jquery -->
    <script>
        $("#fadebtn").click(function(){
            $("#box").fadeTo(1000,0.3)
        })

        $("#resetbtn").click(function(){
            $("#box").fadeTo(1000,1);
        })
    </script>

</body>

</html>
