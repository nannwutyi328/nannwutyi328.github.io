<body>
    <div class="container text-center">
    ့<h2>JQuery Effects: Hide Method</h2>
    <p>The <code>hide()</code><b><i>method hides the selected element</i></b></p>


    <pre>
        Sytax: <code>$(selector).hide();</code>
    </pre>


    <p class="para">This is a paragraph</p>

    <button id="hidden" class="btn btn-danger">Hide</button>

</div>


    <script>
        //jquery
        $("#hidden").click(function()   {
            $(".para").hide();
        });


    </script>
