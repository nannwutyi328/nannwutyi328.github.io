<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;


        }

        #box {
            width: 200px;
            height: 200px;
            background-color: red;
        }







        
    </style>

</head>

<body>
    <div class="container mt-3 text-center">

        <h2>JQuery Effects:animate Method</h2>
        <p>The <code>animate()</code>method<b><i>animate one or more css properties of an element</i></b></p>


        <p>
            Sytax: <code>$(selector).slideToggle();</code>
        </p>

        <!-- box -->
        <div id="box" class="m-auto"></div>
           
        <br>


        <button id="animate" class="btn btn-info">Animate</button>




    </div>


    <!-- jquery -->
    <script>
        $("#animate").click(function () {
            $("#box").animate({
                left:"250px",
                width:"300px",
                height:"300px",
                opacity: "0.5"
            },1000);
           

        });


    </script>

</body>

</html>
