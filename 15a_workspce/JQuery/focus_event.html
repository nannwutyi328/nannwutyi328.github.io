<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>
    <div class="m-3 container border border-3 rounded-4 bg-dark text-white border-info p-4">
        <h2>focus() Method</h2>
        <p class="fs-4 " style="font-family:Georgia, 'Times New Roman', Times, serif ; ">
            It occurs when a user <b><i>clicks or tabs into</i></b> a form element such as text box,password field or
            textarea .It
            is commonly used to highlight the active input field.
        </p>

        <label for="name">Name</label>
        <input type="text" name="name" id="name">
    </div>



    <script>

        $(document).ready(function () {

            $("#name").focus(function () {

                $(this).css("background-color", "lightgreen");

            })

        });

    </script>

    
</body>

</html>
