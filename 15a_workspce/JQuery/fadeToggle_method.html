<body >


    <div class="container text-center ">
    <h2>JQuery Effects:FadeToggle Method</h2>
    <p>The <code>FadeToggle()</code>method<b><i>switched between fade in and fade out</i></b></p>


    <p>
        Sytax: <code>$(selector).FadeToggle();</code>
    </p>


    <!-- <p class="para bg-success text-white" style="display: none; width:fit-content; margin: auto;" >This is a paragraph</p> -->

    <img src="cartoon.gif" id="image" alt="image" width="200px" height="200px">
    <br>
    <button id="btn" class="btn btn-info">Show</button>

</div>


    <script>
        //jquery
        $("#btn").contextmenu(function(){
            $("div").fadeToggle()
        });


        


       


    </script>
