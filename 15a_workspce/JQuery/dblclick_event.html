<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse event:dblclick</title>
    <script src="jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>
    <p class="para " style="font-family:Georgia, 'Times New Roman', Times, serif; margin: 20px; font-size: xx-large;">Double click this text</p>


    <script>
        $(document).ready(function () {
            $(".para").dblclick(function () {
                $(this).text("You double-clicked the paragraph.")
                $(this).css("background-color", "red");
                $(this).css("font-size", "30px");
                $(this).css("text-align", "center");


            });
        });

    </script>













</body>

</html>
