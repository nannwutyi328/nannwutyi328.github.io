<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JavaScript Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .error {
            color: red;
            font-size: 0.9em;
        }

        input,
        button {
            margin: 5px 0;
            padding: 8px;
            width: 250px;
        }
    </style>
</head>

<body>

    <h2>Registration Form</h2>
    <form id="myForm" novalidate>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name">
        <div id="nameError" class="error"></div>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email">
        <div id="emailError" class="error"></div>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="1">
        <div id="ageError" class="error"></div>

        <button type="submit">Submit</button>
    </form>

    <script>
        // Utility function to show error messages
        function showError(id, message) {
            document.getElementById(id).textContent = message;
        }

        // Form validation logic
        document.getElementById("myForm").addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent form from submitting by default

            let isValid = true;

            // Get form values
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const age = document.getElementById("age").value.trim();



            // Clear previous errors
            showError("nameError", "");
            showError("emailError", "");
            showError("ageError", "");

            // Validate name
            if (name === "") {
                showError("nameError", "Name is required.");
                isValid = false;
            }

            // Validate email
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === "") {
                showError("emailError", "Email is required.");
                isValid = false;
            } else if (!emailPattern.test(email)) {
                showError("emailError", "Please enter a valid email address.");
                isValid = false;
            }

            // Validate age
            if (age === "") {
                showError("ageError", "Age is required.");
                isValid = false;
            } else if (isNaN(age) || age <= 0) {
                showError("ageError", "Please enter a valid positive number.");
                isValid = false;
            }

            // If valid, simulate form submission
            if (isValid) {
                alert("Form submitted successfully!");
                // Here you could send data via fetch() or XMLHttpRequest
                // Example: fetch('/submit', { method: 'POST', body: new FormData(this) });
            }
        });
    </script>

</body>

</html>
