<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Event: onckick</title>
</head>
<body>
    <h2>Click Event</h2>
    <p>onclick: runs when an element is clicked.</p>
    <p id="para">Hello Javascript</p>
    <button onclick="changeText()">Click Me</button>
    <script>
        function changeText(){
            document.getElementById("para").innerHTML = "Button Clicked!";
        }
    </script>
    
</body>
</html>
