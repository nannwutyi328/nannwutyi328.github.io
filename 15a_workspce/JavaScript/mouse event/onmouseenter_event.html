<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Enter Event</title>
</head>
<body>
    <p>It occurs <b>whenever the user enter the mouse pointer over an HTML element.</b></p>
    <div style="width: 300px; height: 150px; background: lightblue;" onmouseenter="change_style()">Enter your mouse here</div>

    <p>HTML</p>
    <p>CSS</p>
    <p>Javascript</p>
    <p>Bootstrap</p>
    <script>
          function change_style(){
                document.querySelectorAll("p")[0].style.color="red";
                document.querySelectorAll("p")[3].style.color="red";

            }
    </script>
</body>
</html>
