<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body{
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: aquamarine;
        }

        #div1 {
            background-color: rgb(0, 255, 255);
        }


    </style>
</head>

<body>
    <!-- container fluid =full width /container=space par -->
    <div class="container mt-5 border border-5 border-warning p-3 w-50 rounded rounded-3  " id=div1>

        <div class="card shadow ">
            <div class="card-header bg-primary text-white text-center">
                <h2>Shopping Bill Calculator</h2>
            </div>
        </div>
   

    <!-- Card body -->
    <div class="card-body">

        <!-- Price -->
        <div class="mb-3 ">
            <label class="form-label" for="price">Product Price</label>
            <input class="form-control" type="number" id="price" name="price" placeholder="Enter Product Price">
        </div>

        <!-- Quantity -->
        <div class="mb-3 ">
            <label class="form-label" for="qty">Quantity</label>
            <input class="form-control" type="number" name="qty" id="qty" placeholder="Enter Quantity">
        </div>


        <!-- Button -->
        <button class="btn btn-success w-100" id="btn1" onclick="calculate_Bill()">
            Calculate
        </button>

        <!-- Alert -->
        <div class="alert alert-success mt-3">
            <h5 id="result">Total Bill: 0 MMK</h5>
        </div>
    </div>

        <!-- JS Code -->
        <!-- <script>
            function calculate_Bill() {
                let price=document.getElementById("price").value;
                let quantity=document.getElementById("qty").value;

                let total=price*quantity;
                document.getElementById("result").innerHTML="Total Bill: " +total+ " MMK";

            }
        </script>
 -->


        <!-- JS Code -->
        <script>
            function calculate_Bill(){
                let btn=document.getElementById("btn1");
                //check function
                if(btn.innerHTML=="Calculate"){
                    let price=document.getElementById("price").value;
                    let quantity=document.getElementById("qty").value;
                    let total=price*quantity;
                    document.getElementById("result").innerHTML="Total Bill: " +total+ " MMK";
                    btn.innerHTML="Reset";
                    
                }else{
                    document.getElementById("price").value= "";
                   document.getElementById("qty").value= "";
                    document.getElementById("result").innerHTML="Total Bill: 0 MMK";
                    
                    btn.innerHTML="Calculate";


                }






            }
        </script>



    </div>
    <!-- Form -->
    <form action="">

    </form>
</body>

</html>
