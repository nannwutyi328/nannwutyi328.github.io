<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap button</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body >
    <h1 class="text-center">Bootstrap Button</h1>


    <!-- Button Styles -->
    <div class="container m-4 border border-2 border-dark rounded p-4 ">

        <h3 class="text-center pb-3" >Button Styles</h3>
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-light">Light</button>
        <button class="btn btn-dark">Dark</button>
        <button class="btn btn-success">Success</button>

    </div>


    <!-- Button Outline -->
    <div class="container m-4 border border-2 border-dark rounded p-5 ">
        <h3 class="text-center pb-3">Button OutLine</h3>
        <button class="btn btn-outline-primary">Primary</button>
        <button class="btn btn-outline-warning">Warning</button>
        <button class="btn btn-outline-info">Info</button>
        <button class="btn btn-outline-secondary">Secondary</button>
        <button class="btn btn-outline-danger">Danger</button>
        <button class="btn btn-outline-light">Light</button>
        <button class="btn btn-outline-dark">Dark</button>
        <button class="btn btn-outline-success">Success</button>

    </div>


    <!-- Button Sizes -->
    <div class="container m-4 border border-2 border-dark rounded p-5 ">
        <h3 class="text-center pb-3">Button Sizes</h3>
        <button class="btn btn-sm btn-success">Small</button>
        <button class="btn  btn-info">Default</button>
        <button class="btn btn-lg btn-warning">Large</button>
    </div>


    <!-- Button Full Width -->
    <div class="container m-4 border border-2 border-dark rounded p-5 ">
        <h3 class="text-center pb-3">Full Width Button </h3>
        <div class="d-grid gap-2">
            <button class="btn btn-info " style="font-family: 'Courier New', Courier, monospace;">Full Width Button</button>
            <button class="btn btn-success" style="font-family: 'Courier New', Courier, monospace;">Full Width Button</button>
            <button class="btn btn-warning" style="font-family: 'Courier New', Courier, monospace;">Full Width Button</button>

        </div>
    </div>

    <!-- Active and Disabled Button -->
    <div class="container m-4 border border-2 border-dark rounded p-5 ">
        <h3 class="text-center pb-3">Active and Disabled Button</h3>
        <button class="btn btn-success active">Active Button</button>
        <button class="btn btn-primary" disabled>Disabled Attributed</button>
        <button class="btn btn-warning disabled" >Disabled class</button>

    </div>
    <!-- spinner Buttons -->
     <div class="container m-4 border border-2 border-dark rounded p-5 ">

        <h3 class="text-center pb-3">Spinner Buttons</h3>

        <button class="btn btn-primary" >
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Loading...
        </button>

        <button class="btn btn-info" type="button" disabled>
            <span class="spinner-border " role="status" aria-hidden="true"></span>
            Loading...
        </button>

        <button class="btn btn-success" >
            <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
            Loading...
        </button>

        <button class="btn btn-warning" type="button" disabled>
            <span class="spinner-grow " role="status" aria-hidden="true"></span>
            Loading...
        </button>

     </div>
</body>

</html>
