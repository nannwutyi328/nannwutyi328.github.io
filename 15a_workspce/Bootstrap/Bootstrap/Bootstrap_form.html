<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>

    <div class="container  border border-2 border-info rounded p-4 ">

        <form action="_blank" method="get" class="d-grid gap-3 was-validated">
            <h3 class="text-center text-primary fw-bold">Stack Form</h3>

            <div>
                <Label for="telephone" class="form-label">Telephone</Label>
                <input type="text" class="form-control" name="phone" id="phone" placeholder="Phone" required>
                <!-- valid  -->
                <div class="valid-feedback">Valid</div>
                <div class="invalid-feedback">Please fill out this field</div>
            </div>
           
            <div>
                <Label for="address" class="form-label">Address</Label>
                <input type="text" class="form-control" name="phone" id="phone" placeholder="Address" required>
                 <!--valid  -->
                <div class="valid-feedback">Valid</div>
                <div class="invalid-feedback">Please fill out this field</div>
            </div>

            <!-- radio -->

            <div>
                <label for="gender" class="form-label">Gender</label>

                <input type="radio" class="form-check-input" name="gender" id="female" checked>
                <label for="female" class="form-check-label">Female</label>

                <input type="radio" class="form-check-input" name="gender" id="male">
                <label for="male" class="form-check-label">Female</label>

            </div>

            <!-- checkbox -->

            <div>
                <Label class="form-label">Programming Language</Label>
                <div>
                    <input type="checkbox" name="Language" id="Java" class="form-check-input" checked>
                    <label for="Java" class="form-check-label">Java</label>
                </div>
                <div>
                    <input type="checkbox" name="Language" id="Python" class="form-check-input">
                    <label for="Python" class="form-check-label">CSS</label>
                </div>
                <div>
                    <input type="checkbox" name="Language" id="CSS" class="form-check-input">
                    <label for="CSS" class="form-check-label">Python</label>
                </div>
                <div>
                    <input type="checkbox" name="Language" id="HTML" class="form-check-input">
                    <label for="HTML" class="form-check-label">HTML</label>
                </div>
            </div>


            <!-- dropdown List -->
            <div>
                <Label for="city" class="form-label">City</Label>
                <select size="2" multiple class="form-select form-select-sm">
                    <option value="YGN">YGN</option>
                    <option value="MDY">MDY</option>
                    <option value="NPT">NPT</option>
                </select>

            </div>


            <div class="mb-3">
                <Label for="city" class="form-label">City</Label>
                <select class="form-select ">
                    <option value="YGN">YGN</option>
                    <option value="MDY">MDY</option>
                    <option value="NPT">NPT</option>
                </select>

            </div>
            <div class="mb-3">
                <Label for="city" class="form-label">City</Label>
                <select class="form-select form-select-lg ">
                    <option value="YGN">YGN</option>
                    <option value="MDY">MDY</option>
                    <option value="NPT">NPT</option>
                </select>

            </div>



            <div class="mb-3">
                <label for="defaultrange" class="form-label">Default Rating</label>
                <input type="range" name="defaultrange" id="range" class="form-range">
            </div>

            <div>

                <label for="customrange" class="form-label">Custom Rating</label>
                <input type="range" name="customrange" id="range" class="form-range" step="10" min="0" max="50">

            </div>


        </form>
    </div>

    <!-- Inline Form:row and column -->
    <h3 class="text-center text-primary fw-bold mt-5 mb-4">Inline Form using row and col Class</h3>
    <div class="container  border border-2 border-info rounded p-4 ">
        <form action="_blank" >

            <div class="row">
                <div class="col">
                    <label for="color" class="form-label">Pick up color:</label>
                    <input type="color" name="color" id="color" class="form-control">
                </div>
                <div class="col">
                    <label for="file" class="form-label">Upload File:</label>
                    <input type="file" name="file" id="file" class="form-control">
                </div>
            </div>

        </form>
    </div>

    <h3 class="text-center text-primary fw-bold  mt-5 mb-4">Form Control Size</h3>

    <div class="container  border border-2 border-info rounded p-4 " >
        
        <form action="_blank" >
            <!-- small -->
            <label for="small" class="form-label">Small Size</label>
            <input type="week" name="small" id="small" class="form-control form-control-sm">
            <!-- default -->
            <label for="default" class="form-label">Default Size</label>
            <input type="time" name="default" id="default" class="form-control ">
            <!-- large size -->
            <label for="large" class="form-label">Large Size</label>
            <input type="datetime-local" name="large" id="large" class="form-control form-control-lg">
        </form>
    </div>

</body>

</html>
