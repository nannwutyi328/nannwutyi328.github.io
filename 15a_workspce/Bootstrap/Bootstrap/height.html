<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    
</head>
<body>
    <h3 class="m-3  text-primary text-center ">Height with example</h3>

    <div class="container mt-4  d-flex " style="height: 300px;">

        <span class="h-25  bg-primary me-2 p-2">Height 25%</span>
        <span class="h-50 bg-warning  me-2 p-2">Height 50%</span>
        <span class="h-75  bg-danger  me-2 p-2">Height 75%</span>
        <span class="h-100  bg-secondary  me-2 p-2">Height 100% </span>
        <span class="h-auto  bg-success  me-2 p-2">Auto Height</span>
        <span class="mh-100  bg-info  me-2 p-2">Max Height-100%</span>
    </div>
</body>
</html>
