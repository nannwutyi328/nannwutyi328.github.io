<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Container and Border Example</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"> </script>

    <!-- <link rel="stylesheet" href="bootstrap-5.3.2-dist/css/bootstrap.css"> -->

</head>

<body>
    <div class="container border border-3 bg-light mt-3  p-3 text-center text-primary" >
        <h3>Container-xsm</h3>
    </div>
    <div class="container-sm border border-3 bg-light mt-3 p-3 text-center  text-primary" >
        <h3>Container-sm</h3>
    </div>
    <div class="container-md border border-3 bg-light mt-3  p-3 text-center  text-primary" >
        <h3>Container-md</h3>
    </div>
    <div class="container-lg border border-3 bg-light mt-3 p-3 text-center  text-primary" >
        <h3>Container-lg</h3>
    </div>

    <div class="container-xl border border-3 bg-light mt-3 p-3 text-center  text-primary" >
        <h3>Container-xl</h3>
    </div>
    <div class="Container-xxl col-md-12 col-lg-4 border border-3 bg-light mt-3 p-3 text-center  text-primary" >
        <h3>Container-xxl</h3>
    </div>
</body>
</html>
