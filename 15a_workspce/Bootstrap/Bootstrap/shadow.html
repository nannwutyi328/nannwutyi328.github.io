<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Shadow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>
<body>
    <div class="container mt-3">
        <h2 class="mb-5 text-danger text-center">Bootstrap Shadow Examples</h2>
        <!-- No Shadow -->
         <div class="border rounded bg-info mb-5 p-3 shadow-none">
            No shadow 
         </div>
        <!-- Default -->
         <div class="border rounded bg-secondary mb-5 p-3 shadow">
            Default Shadow
         </div>
        <!-- Small -->
         <div class="border rounded bg-danger mb-5 p-3 shadow-sm">
            small shadow
         </div>
         
        <!-- Large -->
         <div class="border rounded bg-warning p-3 shadow-lg">
            Large shadow
         </div>
    </div>
</body>
</html>
