<html lang="en">

<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <title>Width Example</title>
</head>

<body>
    <h3 class="m-3  text-primary text-center"> Width class Example</h3>
    <div class="container mt-4 border border-3 border-primary rounded p-5">

        <div class="w-100 bg-success mb-3 p-2">Width-100%</div>

    </div>
