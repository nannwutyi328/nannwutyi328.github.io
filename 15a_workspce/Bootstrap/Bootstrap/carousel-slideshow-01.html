
<!DOCTYPE html>
<html lang="en">

<head>

    <title>Navigation Example</title>

    <meta charset="UTF-8">
    <meta name="description" content="This website demonstrates the Borders using Bootstrap">
    <meta name="keywords" content="html, Boostrap, Borders">

    <!--Mobile Layout-->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"> </script>
    <!--Local 
    <link rel="stylesheet" href="bootstrap-5.3.2-dist/css/bootstrap.css">-->
    <style>
        img.slide{
            width: 100%;
        }
    </style>
</head>

<body>
    <header class="container-fluid bg-secondary p-5 text-center ">
        <h1>Bootstrap slide show</h1>
    </header>

    <nav class="navbar navbar-expand-sm bg-dark navbar-dark sticky-top">
        <img class="navbar-bran ps-3 ps-lg-5" src="image/icon/favicon_white_small.png">
        
        <buttton class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#top-menu">
            <span class="navbar-toggler-icon"></span>
        </buttton>
        <div id="top-menu" class="collapse navbar-collapse">
            <div class="container-fluid">

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" href="#">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

      <div id="demo" class="carousel slide" data-bs-ride="carousel">
        <!-- dash/dot indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
            <button  type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>

        </div>
            <!-- slide show image -->

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="image/slide/metro-wallpaper-01.jpg" class="d-block slide">
                <!-- slide caption -->
                <div class="carousel-caption">
                    <h3 class="text-warning" >Monywa</h3>
                    <p class="text-warning" >We had a great time in Monywa!</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="image/slide/Jslide-01.jpg" class="d-block slide">
                <div class="carousel-caption">
                    <h3  class="text-dark">Monywa</h3>
                    <p class="text-dark">We had a great time in Monywa!</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="image/slide/Jslide3.jpg" class="d-block slide">
                <div class="carousel-caption">
                    <h3 class="text-primary">Monywa</h3>
                    <p class="text-primary">We had a great time in Monywa!</p>
                </div>
            </div>
        </div>
<!-- left right indicators -->
        <button type="button" class="carousel-control-prev" data-bs-target="#demo" data-bs-slide="prev"  > 
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button type="button" class="carousel-control-next" data-bs-target="#demo" data-bs-slide="next" > 
            <span class="carousel-control-next-icon"></span>

        </button>
      </div>


    <section>
        
    </section>



</body>
<footer class="container-fluid bg-light">
    <div class="bg-light text-center border-top-2 py-5 text-center text-muted">
        <h4> &copy; COPYRIGHT Metro Computer Myanmar 2026</h4>
    </div>

</footer>

</html>
