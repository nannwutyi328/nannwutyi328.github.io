<!DOCTYPE html>
<html lang="en">
<head>

    <title>Container and Border Example</title>

    <meta charset="UTF-8">
    <meta name="description" content="This website demonstrates the Borders using Bootstrap">
    <meta name="keywords" content="html, Boostrap, Borders">
    
    <!--Mobile Layout-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"> </script>
     <!--Local 
    <link rel="stylesheet" href="bootstrap-5.3.2-dist/css/bootstrap.css">-->

</head>
<body>
    <main class="container-fluid bg-secondary p-5">
        <div class="container bg-light">
            <div style="height: 200px;"></div>
        </div>

    </main>
    <section class="container bg-light py-5">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-3 ">
                <div class="bg-secondary" style="height: 200px;"></div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-secondary" style="height: 200px;"></div>
            </div>
           <div class="col-12 col-md-6 col-lg-3">
                 <div class="bg-secondary" style="height: 200px;"></div>
            </div>
             <div class="col-12 col-md-6 col-lg-3">
                 <div class="bg-secondary" style="height: 200px;"></div>
            </div>
        </div>

    </section>
    <footer class="container">
        <div class="bg-light text-center border-top border-2 border-primary py-3">
          <h4> &copy; COPYRIGHT Metro Computer Myanmar 2026</h4>
        </div>

    </footer>
    
    
</body>
</html>
