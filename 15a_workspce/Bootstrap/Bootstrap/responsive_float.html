<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive float</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>


<body>
    <div class="container mt-4 border border-3 border-primary rounded p-5">
        <h2>Responsive Float Example</h2>
        <!--Difference  screen size  are sm (>=576px),md(>769px),lg(>=992px),xl(>=1200px) or xxl (>=1400px)-->
        <img src="image/boot1.png" class="float-md-start mb-3 me-md-3" alt="sample " width="200px" height="200px" >
        <p>
            This image will not float on small screen.
            On medium screen (768px and above),it will float to the left.
        </p>
        <p>
            Bootstrap responsive float utiltites help to create layouts that adapt to different screen sizes.

        </p>
        <div class="clearfix"></div>

    </div>
    

</body>
</html>
