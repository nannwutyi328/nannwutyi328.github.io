<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <fieldset>
        <h2>Regestration form</h2>
        <form target="_blank" name="Academic form"  method="post" action="Course_Time_Table_Exercise.html">

        <fieldset>
            <legend>Academic Information</legend>
            <label for="Degree">Degree</label>
            <select id="Degree" name="Degree">
                <option value="MBA">Master of Business Administration</option>
                <option value="SCC">System creater course</option>
                <option value="AI Analysis">AI Analysis</option>
            </select><br><br>
            <label>Student ID</label>
            <input type="number" id="sid" min="1" required><br><br>
            <label for="Class Attended">Classes Attended</label>
            <select name="Class Attended" value="subject" multiple="multiple">
                <option value="IT" selected>IT</option>
                <option value="Japanese">Japanese</option>
                <option value="Chinese">Chinese</option>
            </select>
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Personal Details</legend>
            <label for="fname">First Name</label>
            <input type="text" name="fname" placeholder="Enter first name">
            <label for="lname">Last Name</label>
            <input type="text" name="lname" placeholder="Enter last name"><br><br>
            <label for="Birthdate">Birthdate</label>
            <input type="date" id="Birthdate" name="Birthdate">
            <input type="range" min="0" max="50">
            <br><br>
            <label for="gender">Gender</label>
            <input type="radio" name="gender"   value="male">   
            <label for="male">Male</label>
            <input type="radio" name="gender" value="female">
            <label for="female">Female</label><br><br>
            <label for="email">Email</label>
            <input type="email" name="email" required>
        </fieldset><br><br>
            <textarea name="condition detail" rows="3" cols="30">TERMS AND CONDITIONS.......</textarea><br><br>
            <input type="submit" name="Form send" value="Send Form">
            <input type="reset" name="clearform" value="Clear form">
        </form>
    </fieldset>
    </body>
</html>
