<!DOCTYPE html>
<html>
    <head>
        <style>
            .parent{
                background-color:red;
                padding:10px;
                
                
            }
            
            .good{

                border-radius: 7px;
                
            }
            input{
                border: none ;
            }
            
         </style>
    </head>

    <body>
        <center>
        <h2><u><center>HTML Calculator</center></u></h2>
        
            <center>
        <table border="3" Cellspacing="5" Cellpadding="15"class="good" width="10%" style="background-color: black;">
        
            <div >
            <tr >
                <th colspan="3" class="good" style="background-color:green;">
                
                    <input    type="text" width="100%" style="background-color: green ;"  >
                    
            </th>
               
                <th colspan="4" class="parent good" style="width: 50%" >C</th>
               
            </tr>

            <tr >
                <th  class="good" style="background-color: white;">1</th>
                <th class="good" style="background-color: white;">2</th>
                <th class="good" style="background-color: white;">3</th>
                <th  class="good"style="background-color: blue;">/</th>
            </tr>
            <tr>
                <th class="good" style="background-color: white;">4</th>
                <th class="good" style="background-color: white;">5</th>
                <th class="good" style="background-color: white;">6</th>
                <th  class="good"style="background-color: blue;">*</th>

            </tr>
            <tr>
                <th class="good" style="background-color: white;">7</th>
                <th class="good" style="background-color: white;">8</th>
                <th class="good" style="background-color: white;">9</th>
                <th  class="good"style="background-color: blue;">-</th>

            </tr>
            <tr>
                <th class="good" style="background-color: white;">0</th>
                <th class="good" style="background-color: white;">.</th>
                <th class="good" style="background-color:blue">=</th>
                <th class="good"style="background-color: blue;">+</th>

            </tr>
            </div>
        </table>
            </center>
    </body>
</html>
