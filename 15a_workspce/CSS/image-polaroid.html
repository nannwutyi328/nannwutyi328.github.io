<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Polaroid/Card</title>
    <style type="text/css">
        div.polaroid{
            width: 25%;
            background-color: white;
            box-shadow: 0px 2px 5px 3px rgb(147, 21, 63);
            padding: 5px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        div.polaroid:hover{
            box-shadow: 0px 2px 5px 3px darkslateblue;
        }
        div.polaroid img{
            width: 100%;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        div.polaroid-content{
            text-align: center;
        }

    </style>
</head>
<body>
    <h2>Image Polaroid/Card</h2>
    <div class="polaroid">
        <img src="image/flower-05.jpg">
        <div class="polaroid-content">
            <p>Welcome from Metro Computer Myanmar</p>
        </div>

    </div>
    
</body>
</html>
