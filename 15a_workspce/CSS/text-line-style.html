<!DOCTYPE html PUBLIC "//W3C//DTD XHTML 5 Transitional//EN/">
<html>
    <head>       
        <meta charset="UTF-8">
        <title>CSS Test</title>        
        <meta name="description" content="CSS test example"/>
        <meta name="keywords" content="css, web design, test"/> 
        <meta name="author" content="kyaw zay oo"/> 
       <style>
        body{
            background-color: pink;
        }

        h1{
            text-decoration: underline;
            text-transform: uppercase;
            text-shadow: 3px 2px black;
            color: blueviolet;
        }
        #end-para{
            text-decoration: line-through;
        }

        p.word{ 
            word-spacing: 8px;
            color:rgb(30, 210, 48);
        } 

        p{
            line-height: 200%;
            text-align: justify;
        }
       
       </style>   
    </head>    
    <body>       
        
       
        <h1>This is specific class test</h1>
        <p class="center large">This is some text that will appear on the web page.</p>
        <br>
        
            <p >This is some text that will appear on the web page.</p>
            <p class="word">
                <div>This is simple paragraph.</div>
                <div>This is sub paragraph.</div>
                <div>This is some text that will appear on the web page.</div>
             </p>
            <p id="end-para">Metro</p>

       
    </body>
</html>
