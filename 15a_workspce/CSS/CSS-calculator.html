<!DOCTYPE html public >

<head>
    <meta charset="UTF-8">
    <title> CSS Calculator</title>
    <meta name="description" content="HTML tutorial for Calculator"/>
    <meta name="keywords" content="html, web desgin,CSS Calculator"/>
    <meta name="author" content="Yamin Hlaing"/>
    <meta http --equiv="refresh" content="25" url="http://www.google.com"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">

    <style>
        body{
            background-color: whitesmoke;
            margin: 50px;
           
        }
        .title{
            margin: 40px;
            color: palevioletred;
            text-shadow: 2px 2px rgb(141, 88, 88);
            font-family: Sofia,Arial, Helvetica, sans-serif;
            }
        .calculator-box{
            background-color: rgb(141, 88, 88);
            width: 280px;
            height: 370px;
            border: 4px solid palevioletred;
            border-radius: 20px;
        }
        .inputbox{
         background-color: antiquewhite;
         margin-top: 20px; 
         margin-right: 15px; 
         margin-left: 15px; 
         margin-bottom: 12px;
         padding: 10px;
         border-radius: 10px;
         border: 5px solid palevioletred ;
         font-size: 18px;
         text-align: right;
        }
        button{
            width: 45px;
            height: 45px;
            margin-top: 10px; 
            margin-right: 5px;
            margin-left: 10px; 
            padding: 10px;
            border-radius: 8px;
            background-color: palevioletred;
            font-size: medium;
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
            box-shadow: 5px 5px 5px;
            color:black;

            
        }
      
    </style>;
</head>
<body>
    <center>
    <h1 class="title">CSS Calculator</h1>
    
    <div class="calculator-box">
      <input type="text" class="inputbox">
     <div>
         <button>AC</button>
         <button>Del</button>
         <button>%</button>
         <button>/</button>
         <button>7</button>
         <button>8</button>
         <button>9</button>
         <button>*</button>
         <button>4</button>
         <button>5</button>
         <button>6</button>
         <button>-</button>
         <button>1</button>
         <button>2</button>
         <button>3</button>
         <button>+</button>
         <button>Mr</button>
         <button>0</button>
         <button>.</button>
         <button>=</button>
        
     </div>

    </div>
    </center>
</body>
</html>
