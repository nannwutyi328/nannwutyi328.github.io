<!DOCTYPE html PUBLIC "//W3C//DTD XHTML 5 Transitional//EN/">
<html>
    <head>       
        <meta charset="UTF-8">
        <title>CSS Test</title>        
        <meta name="description" content="CSS test example"/>
        <meta name="keywords" content="css, web design, test"/> 
        <meta name="author" content="kyaw zay oo"/> 
        <link rel="stylesheet"  href="css/myStyle.css">    
        <style>
            body{
                font-size: 100%;
            }
           @font-face {
            font-family: Pyidaungsu-2.5.3_Regular;
            src: url(fonts/Pyidaungsu-2.5.3_Regular.ttf);
           }
           h1{
            font-family: Pyidaungsu-2.5.3_Regular;
            font-size: initial;
            font-size: 10em;
           }

           @font-face {
            font-family: Zawgyi-One;
            src: url(fonts/Zawgyi-One.ttf);
           }
           h2{
            font-family: Zawgyi-One, 'Times New Roman', 'Times New Roman', Times, serif;
            font-size: oblique;
            font-size:4.5em;
            font-weight: bold;
           }
           
           @font-face {
            font-family: Zawgyi-One;
            src: url(fonts/Zawgyi-One.ttf);
           }
           h3{
            font-family: Zawgyi-One, 'Times New Roman', 'Times New Roman', Times, serif;
            font-size: initial;
            font-size: 32px;
           }
           @font-face {
            font-family: Zawgyi-One;
            src: url(fonts/Zawgyi-One.ttf);
           }
           h4{
            font-family: Zawgyi-One, 'Times New Roman', 'Times New Roman', Times, serif;
            font-size: initial;
            font-size: 32px;
            font-weight: lighter;
            font-variant-caps: small-caps;
           }

        

        </style>
    </head>    
    <body> 
        <h1>မင်္ဂလာပါ</h1>
        <h2>ပင္မစာမ်က္ႏွာ</h2>
        <h3>愛してる</h3> 
        <h4>This is Some text that will Appear on the Web Page.</h4>
  
    </body>
</html>
