<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"></head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body{
            background: linear-gradient(rgba(220, 209, 209, 0.797), rgb(154, 240, 6), rgba(253, 228, 228, 0.797));

         }

    
       
    </style>

<body >

    <div class="container mt-5 ">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4 "  style="font-family: Georgia, 'Times New Roman', Times, serif; background: linear-gradient(rgba(238, 132, 132, 0.797), rgb(6, 185, 240), rgba(253, 228, 228, 0.797));"
>
                    <h3 class="text-center mb-4 text-primary">Student Registration Form</h3>
                    
                    <!-- Registration Form -->
                    <form id="regForm" >
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" placeholder="Enter name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" id="age" class="form-control" placeholder="Enter age">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select id="gender" class="form-select">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <input type="text" id="course" class="form-control" placeholder="Enter course">
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-primary w-100">Submit</button>
                    </form>

                    <div id="resultCard" class="mt-4 p-3 border rounded bg-white" style="display: none;">
                        <h4 class="text-success">Submitted Information</h4>
                        <p><strong>Name:</strong> <span id="resName"></span></p>
                        <p><strong>Email:</strong> <span id="resEmail"></span></p>
                        <p><strong>Age:</strong> <span id="resAge"></span></p>
                        <p><strong>Gender:</strong> <span id="resGender"></span></p>
                        <p><strong>Course:</strong> <span id="resCourse"></span></p>
                        <p><img src="https://tse1.mm.bing.net/th/id/OIP.SZf4oyaN8vqDmWBYhoXXYgHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt=""></p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    
    <script>
        $('#submitBtn').hover(
            function() { $(this).fadeTo(200, 0.7); },
            function() { $(this).fadeTo(200, 1.0); }
        );

        $('#regForm').on('submit', function(e) {
            e.preventDefault();

            let name = $('#name').val().trim();
            let email = $('#email').val().trim();
            let age = $('#age').val().trim();
            let gender = $('#gender').val();
            let course = $('#course').val().trim();

            if (name === '' || email === '' || age === '' || gender === '' || course === '') {
                alert('Please fill in all required fields!');
                return;
            }

            $('#resName').text(name);
            $('#resEmail').text(email);
            $('#resAge').text(age);
            $('#resGender').text(gender);
            $('#resCourse').text(course);

            $('#resultCard').fadeIn(800);
        });
    </script>
</body>
</html>
